<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>雅思 6.5 词汇</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--fg:#1d2433;--mute:#6b7385;--line:#e3e6ec;--acc:#2f6fed;--ok:#1f9d55;--bad:#d64545;--warn:#d98a00}
@media (prefers-color-scheme:dark){:root{--bg:#12151b;--card:#1b2029;--fg:#e6e9ef;--mute:#9099ab;--line:#2a313d;--acc:#5b8cff;--ok:#3cc47c;--bad:#ff6b6b;--warn:#f0b429}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
main{max-width:640px;margin:0 auto;padding:12px 16px 40px}
nav{display:flex;gap:8px;margin-bottom:12px}
nav button,.seg button{flex:1;padding:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:10px;font-size:15px}
nav button.on,.seg button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.seg{display:flex;gap:6px;margin-bottom:10px}.seg button{padding:7px;font-size:14px}
.q{font-size:30px;font-weight:600;text-align:center;margin:18px 0 4px;word-break:break-word}
.q.cn{font-size:20px;font-weight:500}
.ph{text-align:center;color:var(--mute);min-height:1.5em}
input[type=text]{width:100%;padding:12px;font-size:18px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);margin-top:14px}
.row{display:flex;gap:8px;margin-top:10px}.row button{flex:1;padding:12px;border:0;border-radius:10px;font-size:16px;color:#fff;background:var(--acc)}
.row .b2{background:var(--mute)}.row .ok{background:var(--ok)}.row .bad{background:var(--bad)}
.res{margin-top:12px;min-height:3em}.res b.ok{color:var(--ok)}.res b.bad{color:var(--bad)}
.mute{color:var(--mute);font-size:13px}
label{font-size:14px;color:var(--mute)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.stats div b{display:block;font-size:22px}.stats div span{font-size:12px;color:var(--mute)}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden;display:flex;margin:12px 0 4px}
.bar i{display:block;height:100%}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{cursor:pointer;white-space:nowrap;color:var(--mute);font-weight:500}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
td .m{color:var(--mute);font-size:12px}
.say{float:right;cursor:pointer;padding:2px 6px;font-size:18px;line-height:1;border:0;background:none;color:inherit;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}.say:active{opacity:.5}
.tag{font-size:11px;padding:1px 6px;border-radius:6px;color:#fff}
.kick{margin:6px 6px 0 0;padding:5px 10px;border:1px solid var(--bad);border-radius:8px;background:none;color:var(--bad);font-size:13px}
.kick.on{background:var(--bad);color:#fff}
input[type=password]{width:100%;padding:10px;font-size:15px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg)}
#sync summary{cursor:pointer;color:var(--mute);font-size:13px;margin-top:10px}
#st{margin-top:6px;font-size:14px;font-weight:600}
:root{--h0:#ebedf0;--h1:#9be9a8;--h2:#40c463;--h3:#30a14e;--h4:#216e39}
@media (prefers-color-scheme:dark){:root{--h0:#2a313d;--h1:#0e4429;--h2:#006d32;--h3:#26a641;--h4:#39d353}}
.hmHead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.hmHead .seg{margin:0;flex:0 0 auto}.hmHead .seg button{flex:0 0 auto;padding:4px 10px;font-size:13px}
.hmWrap{display:flex;gap:4px}
.hmDays{display:grid;grid-template-rows:14px repeat(7,11px);row-gap:3px;font-size:10px;line-height:11px;color:var(--mute)}
.hmScroll{flex:1;min-width:0;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px}
#hmMonths,#hm{display:grid;grid-auto-flow:column;grid-auto-columns:11px;column-gap:3px;width:max-content}
#hmMonths{height:14px;margin-bottom:3px;font-size:10px;line-height:11px;color:var(--mute);white-space:nowrap}
#hm{grid-template-rows:repeat(7,11px);row-gap:3px}
#hm i,.legend i{display:block;width:11px;height:11px;border-radius:2px;background:var(--h0)}
#hm i{cursor:pointer}#hm i.sel{outline:2px solid var(--fg);outline-offset:1px}#hm i.fut{visibility:hidden}
.l1{background:var(--h1)!important}.l2{background:var(--h2)!important}.l3{background:var(--h3)!important}.l4{background:var(--h4)!important}
.hmFoot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px}
.legend{display:flex;align-items:center;gap:3px;font-size:11px;color:var(--mute)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);max-width:calc(100% - 32px);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
</style>
</head>
<body>
<main>
<nav><button id="tQuiz" class="on">刷单词</button><button id="tProg">掌握进度</button></nav>

<section id="quiz">
  <div class="card">
    <div class="seg" id="mode"><button data-m="e2c" class="on">英→中</button><button data-m="c2e">中→英</button><button data-m="card">卡片</button></div>
    <div class="seg" id="pool"><button data-p="todo" class="on">未掌握</button><button data-p="weak">易错</button><button data-p="mast">已掌握</button><button data-p="all">全部</button></div>
    <div class="q" id="q">加载中…</div>
    <div class="ph" id="ph"></div>
    <div id="typeBox">
      <input type="text" id="ans" placeholder="输入答案，回车提交" autocomplete="off" autocapitalize="off" spellcheck="false">
      <div class="row"><button id="submit">提交</button><button id="skip" class="b2">不会</button></div>
    </div>
    <div id="cardBox" hidden>
      <div class="row"><button id="flip">显示释义</button></div>
      <div class="row"><button id="know" class="ok">认识</button><button id="dunno" class="bad">不认识</button></div>
    </div>
    <div class="res" id="res"></div>
    <div class="row" id="nextRow" hidden><button id="next">下一个</button><button id="override" class="b2">算我对</button></div>
  </div>
  <div class="mute" id="sess"></div>
</section>

<section id="prog" hidden>
  <div class="card">
    <div class="stats" id="sum"></div>
    <div class="bar" id="bar"></div>
    <div class="mute" id="acc"></div>
    <div class="mute" id="timeLine" style="margin-top:6px"></div>
  </div>
  <div class="card">
    <div class="hmHead"><b id="hmTitle" style="font-size:14px"></b>
      <div class="seg" id="hmMode"><button data-h="ans" class="on">次数</button><button data-h="sec">时长</button></div></div>
    <div class="hmWrap">
      <div class="hmDays"><span></span><span>一</span><span></span><span>三</span><span></span><span>五</span><span></span><span>日</span></div>
      <div class="hmScroll" id="hmScroll"><div id="hmMonths"></div><div id="hm" role="img" aria-label="过去一年每天的学习量"></div></div>
    </div>
    <div class="hmFoot"><span class="mute" id="hmInfo"></span>
      <span class="legend">少<i></i><i class="l1"></i><i class="l2"></i><i class="l3"></i><i class="l4"></i>多</span></div>
  </div>
  <div class="card">
    <input type="text" id="search" placeholder="搜索单词或中文" style="margin-top:0">
    <div class="seg" id="filter" style="margin-top:10px"><button data-f="seen" class="on">刷过的</button><button data-f="mast">已掌握</button><button data-f="weak">易错</button><button data-f="all">全部</button></div>
    <table><thead><tr><th data-k="w">单词</th><th class="n" data-k="seen">次数</th><th class="n" data-k="right">对</th><th class="n" data-k="wrong">错</th><th class="n" data-k="rate">正确率</th></tr></thead><tbody id="tb"></tbody></table>
    <div class="mute" id="more"></div>
  </div>
</section>

<div class="card" id="sync">
  <div class="mute" id="syncMsg"></div>
  <div class="row"><button id="upload">上传进度</button></div>
  <details id="tokBox"><summary>GitHub 令牌设置</summary>
    <p class="mute">令牌只保存在这台设备的浏览器里，不会写进仓库。需要细粒度令牌（Fine-grained token），只授权本仓库的 Contents: Read and write。</p>
    <input type="password" id="tok" placeholder="粘贴 github_pat_..." autocomplete="off">
    <div class="row"><button id="tokSave">保存</button><button id="tokClear" class="b2">清除</button></div>
  </details>
</div>
</main>

<script>
const MASTER = 3; // 与 CLI 保持一致：连续答对 3 次视为掌握
let W = [], HEAD = '', mode = 'e2c', pool = 'todo', cur = null, curDir = 'e2c', answered = false, pend = null;
let sess = {n: 0, ok: 0, sec: 0};
const $ = id => document.getElementById(id);
const store = (k, v) => { try { v === undefined ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} };
const load = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };

// ===== 数据：仓库里的 words.tsv + 本机未上传的答题记录 LOG =====
// LOG 每条 {w, op}：r=答对  w=答错并清零连续  k=答错但保留已掌握  x=被混淆的已掌握词移出
let LOG = []; try { LOG = JSON.parse(load('iel_log') || '[]'); } catch (e) {}
const saveLog = () => { store('iel_log', JSON.stringify(LOG)); updSync(); };
function parseTsv(t) {
  const lines = t.replace(/\r/g, '').split('\n');
  return {head: lines[0], rows: lines.slice(1).filter(Boolean).map(l => { const a = l.split('\t');
    return {w: a[0], ph: a[1] || '', m: a[2] || '', seen: +a[3] || 0, right: +a[4] || 0, wrong: +a[5] || 0, streak: +a[6] || 0}; })};
}
const toTsv = (head, rows) => head + '\n' + rows.map(x => [x.w, x.ph, x.m, x.seen, x.right, x.wrong, x.streak].join('\t')).join('\n') + '\n';
function applyOps(rows, ops) {
  const m = new Map(rows.map(x => [x.w, x]));
  for (const {w, op} of ops) { const x = m.get(w); if (!x) continue;
    if (op === 'x') { x.streak = 0; continue; }
    x.seen++; if (op === 'r') { x.right++; x.streak++; } else { x.wrong++; if (op === 'w') x.streak = 0; } }
}
function setBase(text) { const d = parseTsv(text); HEAD = d.head; W = d.rows; applyOps(W, LOG); }

// ===== 学习时长 + 每日答题数：time.tsv（已上传）+ 本机未上传的部分 =====
const IDLE_MS = 60000; // 两次操作之间最多算 60 秒，走开不累加（命令行相同）
let TB = {}, TBA = {}, TP = {}, TA = {}, lastTick = null; // B=已上传 P/A=本机待传；TB/TP 秒数，TBA/TA 答题数
try { TP = JSON.parse(load('iel_time') || '{}'); TA = JSON.parse(load('iel_ans') || '{}'); } catch (e) {}
const dayStr = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
function parseTime(t, col = 1) { // col 1=秒数 2=答题数
  const o = {};
  t.replace(/\r/g, '').split('\n').slice(1).filter(Boolean).forEach(l => { const a = l.split('\t'); o[a[0]] = (o[a[0]] || 0) + (+a[col] || 0); });
  return o;
}
const toTime = (sec, ans) => 'date\tseconds\tanswers\n' + [...new Set([...Object.keys(sec), ...Object.keys(ans)])].sort()
  .map(d => `${d}\t${sec[d] || 0}\t${ans[d] || 0}\n`).join('');
const merged = (b, p) => { const o = {...b}; for (const d in p) o[d] = (o[d] || 0) + p[d]; return o; };
function tick() {
  const now = Date.now();
  if (lastTick !== null) {
    const s = Math.min(now - lastTick, IDLE_MS) / 1000, d = dayStr(new Date());
    TP[d] = (TP[d] || 0) + s; sess.sec += s; store('iel_time', JSON.stringify(TP));
  }
  lastTick = now;
}
const pendSec = () => Object.values(TP).reduce((a, b) => a + b, 0);
function fmtTime(s) {
  return s < 60 ? `${Math.round(s)} 秒` : s < 3600 ? `${Math.round(s / 60)} 分钟` : `${(s / 3600).toFixed(1)} 小时`;
}
function renderTime() {
  const all = merged(TB, TP);
  const ds =Object.keys(all).filter(d => all[d] > 0).sort(), now = new Date(), from = new Date();
  from.setDate(from.getDate() - 13);
  const sum = f => ds.filter(f).reduce((a, d) => a + all[d], 0), fromS = dayStr(from), today = dayStr(now);
  $('timeLine').textContent = ds.length
    ? `学习时长 ${fmtTime(sum(() => true))} · 过去两周 ${fmtTime(sum(d => d >= fromS))} · 今天 ${fmtTime(sum(d => d === today))} · 最后学习 ${ds[ds.length - 1]}`
    : '学习时长：还没有记录';
}
// ===== 学习热力图（类似 GitHub contributions）：过去一年，每列一周（周一开头），越多越绿 =====
let hmMode = 'ans', hmSel = null;
function renderHeat() {
  const sec = merged(TB, TP), ans = merged(TBA, TA), val = d => (hmMode === 'ans' ? ans : sec)[d] || 0;
  const today = new Date(); today.setHours(12, 0, 0, 0);
  const start = new Date(today); start.setDate(start.getDate() - 52 * 7 - (today.getDay() + 6) % 7); // 52 周前的周一
  const days = []; for (const d = new Date(start); days.length < 53 * 7; d.setDate(d.getDate() + 1)) days.push({s: dayStr(d), m: d.getMonth(), fut: d > today});
  const vals = days.filter(x => !x.fut).map(x => val(x.s)), max = Math.max(0, ...vals), total = vals.reduce((a, b) => a + b, 0);
  const lv = v => v <= 0 || !max ? 0 : Math.min(4, Math.ceil(v / max * 4)); // 按当年最大值分 4 档
  $('hmTitle').textContent = hmMode === 'ans' ? `过去一年答题 ${total} 次` : `过去一年学习 ${fmtTime(total)}`;
  $('hm').innerHTML = days.map(x => `<i data-d="${x.s}" class="${x.fut ? 'fut' : 'l' + lv(val(x.s))}${x.s === hmSel ? ' sel' : ''}" title="${x.s}"></i>`).join('');
  let months = '', prev = -1, lastCol = -9; // 月份标在该月第一个完整周的上方，太挤就跳过
  for (let c = 0; c < 53; c++) { const m = days[c * 7].m;
    if (m !== prev && c - lastCol >= 3 && c < 52) { months += `<span style="grid-column:${c + 1}">${m + 1}月</span>`; lastCol = c; }
    prev = m; }
  $('hmMonths').innerHTML = months;
  hmInfo(hmSel || dayStr(today));
  $('hmScroll').scrollLeft = $('hmScroll').scrollWidth; // 默认显示最近几周
}
function hmInfo(d) {
  const s = merged(TB, TP)[d] || 0, a = merged(TBA, TA)[d] || 0;
  $('hmInfo').textContent = `${d}：` + (s || a ? `答题 ${a} 次 · 用时 ${fmtTime(s)}` : '没有学习');
}
$('hm').addEventListener('click', e => { const c = e.target.closest('i[data-d]'); if (!c || c.classList.contains('fut')) return;
  document.querySelectorAll('#hm i.sel').forEach(x => x.classList.remove('sel')); c.classList.add('sel'); hmSel = c.dataset.d; hmInfo(hmSel); });
$('hm').addEventListener('mouseover', e => { const c = e.target.closest('i[data-d]'); if (c && !c.classList.contains('fut')) hmInfo(c.dataset.d); });
$('hm').addEventListener('mouseleave', () => hmInfo(hmSel || dayStr(new Date())));
seg('hmMode', 'h', m => { hmMode = m; renderHeat(); });
document.addEventListener('visibilitychange',() => { if (document.hidden) tick(); else lastTick = Date.now(); }); // 切走或锁屏不计时
const status = w => w.streak >= MASTER ? 'mast' : w.seen ? 'learn' : 'new';
// 易错 = 错过且还没掌握；答对几次也留在易错里，直到连续答对 MASTER 次
const isWeak = w => w.wrong > 0 && w.streak < MASTER;

// ===== 软匹配（与 iel.cpp 同逻辑）=====
function senses(t) {
  const out = []; let cur = '', depth = 0;
  for (const c of t) {
    if ('(（[【<《'.includes(c)) { depth++; continue; }
    if (')）]】>》'.includes(c)) { depth = Math.max(0, depth - 1); continue; }
    if (depth || /[A-Za-z.]/.test(c)) continue;
    if ('；;，,、|/… \t'.includes(c)) { if (cur) out.push(cur); cur = ''; } else cur += c;
  }
  if (cur) out.push(cur);
  return out;
}
function matchCn(input, meaning) {
  for (const a of senses(input)) for (const s of senses(meaning)) {
    const A = [...a], S = [...s];
    if ((A.length >= 2 || S.length === 1) && (s.includes(a) || a.includes(s))) return true;
    const common = A.filter(c => s.includes(c)).length;
    if (common >= 2 && common * 10 >= A.length * 6 && common * 2 >= S.length) return true;
  }
  return false;
}
function editDist(a, b) {
  const d = [...Array(b.length + 1).keys()];
  for (let i = 1; i <= a.length; i++) { let p = d[0]; d[0] = i;
    for (let j = 1; j <= b.length; j++) { const t = d[j]; d[j] = Math.min(d[j] + 1, d[j - 1] + 1, p + (a[i - 1] !== b[j - 1])); p = t; } }
  return d[b.length];
}

// ===== 刷题 =====
function pick() {
  let c = W.filter(w => pool === 'all' ? true : pool === 'weak' ? isWeak(w) : pool === 'mast' ? w.streak >= MASTER : w.streak < MASTER);
  if (!c.length) { if (pool === 'mast') { $('q').textContent = '还没有已掌握的单词'; return null; } c = W; }
  // 网页里本次答对的往后放，答错的会再出现
  const fresh = c.filter(w => !w._done);
  if (fresh.length) c = fresh;
  if (cur && c.length > 1) c = c.filter(w => w.w !== cur.w); // 不连续出同一个词
  // 和命令行一样的优先级：易错（错过） > 学习中（刷过没错过） > 未学，同级随机
  const rank = w => w.wrong > 0 ? 0 : w.seen > 0 ? 1 : 2;
  const top = Math.min(...c.map(rank));
  c = c.filter(w => rank(w) === top);
  return c[Math.floor(Math.random() * c.length)];
}
function show() {
  tick();
  finalize();
  cur = pick(); answered = false;
  if (!cur) { $('ph').textContent = $('res').innerHTML = ''; $('typeBox').hidden = $('cardBox').hidden = $('nextRow').hidden = true; return; }
  curDir = mode === 'c2e' ? 'c2e' : 'e2c';
  $('q').textContent = curDir === 'e2c' ? cur.w : cur.m;
  $('q').className = 'q' + (curDir === 'c2e' ? ' cn' : '');
  $('ph').textContent = curDir === 'e2c' && cur.ph ? '/' + cur.ph + '/' : '';
  $('res').innerHTML = ''; $('nextRow').hidden = true;
  $('typeBox').hidden = mode === 'card'; $('cardBox').hidden = mode !== 'card';
  $('ans').value = ''; if (mode !== 'card') $('ans').focus({preventScroll: true});
}
// typed=是否输入了答案（"不会/不认识"为 false，已掌握的词直接移出）；mixed=答案其实是这些词的意思/拼写
function reveal(right, extra = '', typed = false, mixed = []) {
  tick();
  answered = true;
  sess.n++; if (right) sess.ok++;
  if (right) cur._done = true;
  const mast = x => x.streak >= MASTER;
  const kickBtn = x => `<button type="button" class="kick" data-w="${esc(x.w)}">移出已掌握：${esc(x.w)}</button>`;
  const ask = [...(!right && typed && mast(cur) ? [cur] : []), ...(right ? [] : mixed.filter(mast))];
  pend = {w: cur.w, right, typed, self: mast(cur), mixed: right ? [] : mixed.filter(mast).map(x => x.w), kick: new Set()};
  $('res').innerHTML = `<b class="${right ? 'ok' : 'bad'}">${right ? '✓ 正确' : '✗ 错误'}</b> ${extra}<button type="button" class="say" tabindex="-1" data-w="${esc(cur.w)}">🔊</button><br><b>${esc(cur.w)}</b> <span class="mute">/${esc(cur.ph)}/</span><br>${esc(cur.m)}`
    + mixed.map(x => `<div class="mute">你的答案是 <b>${esc(x.w)}</b> 的意思：${esc(x.m)}</div>`).join('')
    + (!right && !typed && mast(cur) ? `<div class="mute">↓ ${esc(cur.w)} 移出已掌握</div>` : '')
    + `<div id="st">${stLine(right)}</div>`
    + (ask.length ? `<div id="kicks"><div class="mute">已掌握的词要移出吗？（不点 = 保留）</div>${ask.map(kickBtn).join('')}</div>` : '');
  $('nextRow').hidden = false; $('override').hidden = right;
  $('cardBox').hidden = true;
  updSess();
  speak(cur.w);
}
function speak(t) { // 浏览器/系统自带语音合成
  if (!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(t); u.lang = 'en-US'; u.rate = 0.9;
  const v = speechSynthesis.getVoices().find(v => v.lang.replace('_', '-').startsWith('en-US')) || speechSynthesis.getVoices().find(v => v.lang.startsWith('en'));
  if (v) u.voice = v;
  speechSynthesis.speak(u);
}
function submit() {
  if (answered) return show();
  const a = $('ans').value.trim(), al = a.toLowerCase();
  if (!a) return reveal(false);
  const ok = curDir === 'e2c' ? matchCn(a, cur.m) : al === cur.w.toLowerCase();
  const extra = !ok && curDir === 'c2e' && editDist(al, cur.w.toLowerCase()) === 1 ? '拼写差一点！' : '';
  const mixed = ok ? [] : W.filter(y => y !== cur && (curDir === 'e2c' ? matchCn(a, y.m) : y.w.toLowerCase() === al)).slice(0, 5);
  reveal(ok, extra, true, mixed);
}
// 进入下一题（或上传）前，把本题结果写进 LOG
function finalize() {
  if (!pend) return;
  const p = pend; pend = null;
  const ops = [];
  if (p.right) ops.push({w: p.w, op: 'r'});
  else {
    ops.push({w: p.w, op: !p.self || !p.typed || p.kick.has(p.w) ? 'w' : 'k'});
    p.mixed.forEach(w => { if (p.kick.has(w)) ops.push({w, op: 'x'}); });
  }
  // 状态变化弹提示：刚掌握 / 移出已掌握
  const byW = new Map(W.map(x => [x.w, x])), tips = [];
  for (const {w, op} of ops) { const x = byW.get(w); if (!x) continue;
    if (op === 'r' && x.streak + 1 === MASTER) tips.push(`★ ${w} 已掌握`);
    if ((op === 'w' || op === 'x') && x.streak >= MASTER) tips.push(`↓ ${w} 已移出已掌握`); }
  if (tips.length) toast(tips.join('　'));
  const day = dayStr(new Date()); TA[day] = (TA[day] || 0) + 1; store('iel_ans', JSON.stringify(TA)); // 当天答题数
  LOG.push(...ops); applyOps(W, ops); saveLog();
}
function updSess() { $('sess').textContent = `本次已刷 ${sess.n} 个，答对 ${sess.ok} 个` + (sess.n ? `（${Math.round(sess.ok * 100 / sess.n)}%）` : '') + ` · 本次用时 ${fmtTime(sess.sec)}`; }
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));

$('submit').onclick = submit;
$('ans').onkeydown = e => { if (e.key === 'Enter') submit(); };
$('skip').onclick = () => reveal(false);
$('next').onclick = show;
$('override').onclick = () => { sess.ok++; cur._done = true; $('override').hidden = true; if (pend) pend.right = true; if ($('kicks')) $('kicks').remove(); $('st').textContent = stLine(true); updSess(); };
// 结果里的连续答对提示（与 CLI 的 ★/清零 提示对应）
function stLine(right) {
  const s = cur.streak;
  if (right) return s >= MASTER ? '' : s + 1 >= MASTER ? '★ 已掌握，之后不再出现' : `连续答对 ${s + 1}/${MASTER}`;
  return s > 0 && s < MASTER ? `连续答对清零（之前 ${s}/${MASTER}）` : '';
}
let toastTimer;
function toast(t) {
  let el = document.querySelector('.toast');
  if (!el) { el = document.createElement('div'); el.className = 'toast'; document.body.appendChild(el); }
  el.textContent = t; el.classList.add('on');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('on'), 2200);
}
$('res').addEventListener('click', e => { const b = e.target.closest('.kick'); if (!b || !pend) return;
  const on = b.classList.toggle('on'); on ? pend.kick.add(b.dataset.w) : pend.kick.delete(b.dataset.w);
  b.textContent = (on ? '✓ 将移出：' : '移出已掌握：') + b.dataset.w; });
$('flip').onclick = () => { $('ph').textContent = (cur.ph ? '/' + cur.ph + '/  ' : '') + cur.m; };
$('know').onclick = () => reveal(true);
$('dunno').onclick = () => reveal(false);
document.addEventListener('keydown', e => { if (e.key === 'Enter' && answered && document.activeElement !== $('ans')) show(); });
function seg(id, attr, fn) {
  $(id).onclick = e => { const b = e.target.closest('button'); if (!b) return;
    [...$(id).children].forEach(x => x.classList.toggle('on', x === b)); fn(b.dataset[attr]); };
}
seg('mode', 'm', m => { mode = m; show(); });
seg('pool', 'p', p => { pool = p; show(); });

// ===== 进度 =====
let filter = 'seen', sortK = 'seen', sortDesc = true, limit = 200;
function renderProg() {
  renderTime(); renderHeat();
  const c = {mast: 0, learn: 0, new: 0}; let r = 0, w = 0, seen = 0;
  W.forEach(x => { c[status(x)]++; r += x.right; w += x.wrong; seen += x.seen; });
  const weak = W.filter(isWeak).length, N = W.length;
  $('sum').innerHTML = [['总词数', N], ['已掌握', c.mast], ['学习中', c.learn], ['易错', weak]].map(([k, v]) => `<div><b>${v}</b><span>${k}</span></div>`).join('');
  $('bar').innerHTML = `<i style="width:${c.mast / N * 100}%;background:var(--ok)"></i><i style="width:${c.learn / N * 100}%;background:var(--warn)"></i>`;
  $('acc').innerHTML = `掌握 ${(c.mast / N * 100).toFixed(1)}% · 未学 ${c.new} · 累计答题 ${r + w} 次，对 ${r}，错 ${w}，正确率 ${r + w ? (r * 100 / (r + w)).toFixed(1) : 0}%<br>掌握标准：连续答对 ${MASTER} 次`;
  renderTable();
}
function renderTable() {
  const q = $('search').value.trim().toLowerCase();
  let rows = W.filter(x => filter === 'all' || (filter === 'seen' ? x.seen > 0 : filter === 'mast' ? x.streak >= MASTER : isWeak(x)));
  if (q) rows = (filter === 'seen' && !rows.some(x => x.w.toLowerCase().includes(q) || x.m.includes(q)) ? W : rows).filter(x => x.w.toLowerCase().includes(q) || x.m.includes(q));
  const val = x => sortK === 'w' ? x.w.toLowerCase() : sortK === 'rate' ? (x.seen ? x.right / x.seen : -1) : x[sortK];
  rows.sort((a, b) => { const A = val(a), B = val(b); return (A < B ? -1 : A > B ? 1 : 0) * (sortDesc ? -1 : 1); });
  const tag = x => { const s = status(x); return s === 'mast' ? '<span class="tag" style="background:var(--ok)">已掌握</span>' : isWeak(x) ? '<span class="tag" style="background:var(--bad)">易错</span>' : ''; };
  $('tb').innerHTML = rows.slice(0, limit).map(x => `<tr><td><button type="button" class="say" tabindex="-1" data-w="${esc(x.w)}">🔊</button><b>${esc(x.w)}</b> ${tag(x)}<div class="m">${esc(x.m)}</div></td><td class="n">${x.seen}</td><td class="n">${x.right}</td><td class="n">${x.wrong}</td><td class="n">${x.seen ? Math.round(x.right * 100 / x.seen) + '%' : '-'}</td></tr>`).join('')
    || '<tr><td colspan="5" class="mute">暂无数据。用命令行刷几轮并提交 words.tsv 后这里会显示。</td></tr>';
  $('more').innerHTML = rows.length > limit ? `共 ${rows.length} 条，显示前 ${limit} 条 <a href="#" id="lm">显示更多</a>` : `共 ${rows.length} 条`;
  if ($('lm')) $('lm').onclick = e => { e.preventDefault(); limit += 300; renderTable(); };
}
document.addEventListener('mousedown', e => { if (e.target.closest('.say')) e.preventDefault(); }); // 不抢焦点、不出光标
document.addEventListener('click', e => { const s = e.target.closest('.say'); if (s) { speak(s.dataset.w); getSelection().removeAllRanges(); } });
$('search').oninput =() => { limit = 200; renderTable(); };
seg('filter', 'f', f => { filter = f; limit = 200; renderTable(); });
document.querySelector('thead').onclick = e => { const k = e.target.dataset.k; if (!k) return; sortDesc = sortK === k ? !sortDesc : k !== 'w'; sortK = k; renderTable(); };

function tab(p) { $('quiz').hidden = p; $('prog').hidden = !p; $('tQuiz').classList.toggle('on', !p); $('tProg').classList.toggle('on', p); if (p) renderProg(); }
$('tQuiz').onclick = () => tab(false); $('tProg').onclick = () => tab(true);

// ===== 上传进度：通过 GitHub API 把合并后的 words.tsv 提交回仓库 =====
const REPO = location.hostname.endsWith('.github.io') && location.pathname.split('/')[1]
  ? location.hostname.split('.')[0] + '/' + location.pathname.split('/')[1] : 'PMZeroSkyline/iel65';
const API = f => `https://api.github.com/repos/${REPO}/contents/${f}`;
const token = () => load('iel_token') || '';
const ghHeaders = extra => ({Authorization: 'Bearer ' + token(), 'X-GitHub-Api-Version': '2022-11-28', ...extra});
async function fetchLatest(file) { // 取最新内容和它的 blob sha（用内容算 sha，保证两者一致）
  const r = await fetch(API(file) + '?ref=main', {headers: ghHeaders({Accept: 'application/vnd.github.raw'}), cache: 'no-store'});
  if (!r.ok) throw new Error(r.status === 401 ? '令牌无效或已过期' : r.status === 404 ? '找不到仓库，检查令牌权限' : '读取失败 ' + r.status);
  const buf = new Uint8Array(await r.arrayBuffer());
  const pre = new TextEncoder().encode(`blob ${buf.length}\0`), all = new Uint8Array(pre.length + buf.length);
  all.set(pre); all.set(buf, pre.length);
  const sha = [...new Uint8Array(await crypto.subtle.digest('SHA-1', all))].map(b => b.toString(16).padStart(2, '0')).join('');
  return {text: new TextDecoder().decode(buf), sha};
}
function b64(str) {
  const bytes = new TextEncoder().encode(str); let s = '';
  for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(s);
}
let uploading = false;
async function upload() {
  if (!token()) { $('tokBox').open = true; return msg('请先在下面设置 GitHub 令牌'); }
  finalize(); tick();
  const n = LOG.length, snap = {}; // 只上传满 1 秒的部分，零头留到下次
  for (const d in TP) if (TP[d] >= 1) snap[d] = Math.floor(TP[d]);
  const snapA = {...TA}; // 每日答题数，和时长一起写进 time.tsv
  const hasTime = Object.keys(snap).length + Object.keys(snapA).length > 0;
  if (!n && !hasTime) return msg('没有需要上传的记录');
  uploading = true; $('upload').disabled = true; msg('上传中…');
  try {
    if (n) {
      const out = await putFile('words.tsv', `网页刷词：上传 ${n} 条记录`, text => {
        const d = parseTsv(text); applyOps(d.rows, LOG.slice(0, n)); return toTsv(d.head, d.rows); });
      LOG = LOG.slice(n); store('iel_log', JSON.stringify(LOG)); setBase(out);
    }
    if (hasTime) {
      const out = await putFile('time.tsv', `网页学习时长：上传 ${fmtTime(Object.values(snap).reduce((a, b) => a + b, 0))}`, text => {
        return toTime(merged(parseTime(text, 1), snap), merged(parseTime(text, 2), snapA)); });
      for (const d in snap) { TP[d] -= snap[d]; if (TP[d] <= 0) delete TP[d]; }
      for (const d in snapA) { TA[d] -= snapA[d]; if (TA[d] <= 0) delete TA[d]; }
      store('iel_time', JSON.stringify(TP)); store('iel_ans', JSON.stringify(TA)); TB = parseTime(out, 1); TBA = parseTime(out, 2);
    }
    if (!$('prog').hidden) renderProg();
    msg(n ? `已上传 ${n} 条记录 ✓` : '学习时长已上传 ✓');
  } catch (e) { msg('✗ ' + e.message + '（没传上去的仍保存在本机）'); }
  finally { uploading = false; $('upload').disabled = false; }
}
async function putFile(file, message, merge) {
  for (let i = 0; i < 3; i++) { // sha 冲突（电脑端刚推送过）就重新取最新的再合并
    const {text, sha} = await fetchLatest(file), out = merge(text);
    const r = await fetch(API(file), {method: 'PUT', headers: ghHeaders({'Content-Type': 'application/json'}),
      body: JSON.stringify({message, content: b64(out), sha, branch: 'main'})});
    if (r.ok) return out;
    if (r.status !== 409 && r.status !== 422) throw new Error(r.status === 403 ? '令牌没有写权限' : '上传失败 ' + r.status);
  }
  throw new Error('多次冲突，稍后再试');
}
function msg(t) { $('syncMsg').textContent = t; }
function updSync() { if (!uploading) msg(LOG.length || pendSec() >= 1 ? `本机有 ${LOG.length} 条记录、${fmtTime(pendSec())}学习时长待上传` : token() ? '记录已全部上传' : '设置令牌后可以把网页上刷的记录上传到仓库'); }
$('upload').onclick = upload;
$('tokSave').onclick = () => { const t = $('tok').value.trim(); if (!t) return; store('iel_token', t); $('tok').value = ''; $('tokBox').open = false; msg('令牌已保存'); };
$('tokClear').onclick = () => { store('iel_token'); msg('令牌已清除'); };

// 有令牌时直接从 API 读最新的（GitHub Pages 有几分钟缓存）；没有就读 Pages 上的
const loadFile = f => (token() ? fetchLatest(f).then(d => d.text) : Promise.reject()).catch(() => fetch(f, {cache: 'no-cache'}).then(r => { if (!r.ok) throw 0; return r.text(); }));
loadFile('words.tsv')
  .then(t => { setBase(t); show(); updSync(); })
  .catch(() => { $('q').textContent = '加载 words.tsv 失败'; });
loadFile('time.tsv').then(t => { TB = parseTime(t, 1); TBA = parseTime(t, 2); if (!$('prog').hidden) renderProg(); }).catch(() => {});
</script>
